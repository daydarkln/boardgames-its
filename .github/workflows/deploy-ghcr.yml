name: Deploy via GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to deploy
        required: false
        type: string

env:
  APP_NAME: boardgames-its
  APP_ROOT: /opt/boardgames-its
  DEPLOY_BUNDLE: deploy-bundle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          image="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')"

          {
            echo "tags<<EOF"
            echo "${image}:${RELEASE_SHA}"
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ${{ github.repository }}-production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out deploy files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package deploy directory
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test -f deploy/project.env
          test -f deploy/docker-compose.prod.yml
          test -f deploy/scripts/remote-deploy-ghcr.sh
          tar -czf "${RUNNER_TEMP}/${DEPLOY_BUNDLE}-${RELEASE_SHA}.tar.gz" deploy

      - name: Upload deploy bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          target_release="${APP_ROOT}/releases/${RELEASE_SHA}"
          bundle_path="${RUNNER_TEMP}/${DEPLOY_BUNDLE}-${RELEASE_SHA}.tar.gz"
          remote_bundle="/tmp/${APP_NAME}-${RELEASE_SHA}-deploy.tar.gz"

          ssh -p "$port" -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "rm -rf '${target_release}' && mkdir -p '${target_release}'"

          scp -P "$port" -i ~/.ssh/id_ed25519 "$bundle_path" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_bundle}"

          ssh -p "$port" -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "tar -xzf '${remote_bundle}' -C '${target_release}' && rm -f '${remote_bundle}'"

      - name: Run remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          target_release="${APP_ROOT}/releases/${RELEASE_SHA}"
          ssh -p "$port" -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_ROOT='${APP_ROOT}' RELEASE_SHA='${RELEASE_SHA}' RELEASE_DIR='${target_release}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' /bin/bash '${target_release}/deploy/scripts/remote-deploy-ghcr.sh'"
